<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Receipt Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>AI Receipt Generator</h1>
      <p>Enter receipt details and generate a clean receipt instantly.</p>
    </header>

    <main>
      <section class="form-section">
        <div class="input-grid">
          <label>
            Business name
            <input id="businessName" placeholder="Acme Corp" />
          </label>
          <label>
            Date
            <input id="receiptDate" type="date" />
          </label>
          <label>
            Customer name
            <input id="customerName" placeholder="Jordan Smith" />
          </label>
          <label>
            Tax rate (%)
            <input id="taxRate" type="number" min="0" step="0.01" value="5" />
          </label>
          <label>
            Discount (%)
            <input id="discount" type="number" min="0" step="0.01" value="0" />
          </label>
          <label>
            Notes
            <input id="notes" placeholder="Thank you for your business" />
          </label>
        </div>

        <div class="items-card">
          <div class="items-header">
            <h2>Items</h2>
            <button id="addItem" type="button">+ Add item</button>
          </div>
          <div id="itemsList"></div>
        </div>

        <div class="actions">
          <button id="generateReceipt" type="button">Generate Receipt</button>
          <button id="generateAIReceipt" type="button">Generate AI Receipt</button>
        </div>
      </section>

      <section class="receipt-section">
        <h2>Receipt Preview</h2>
        <pre id="receiptOutput" class="receipt-output">No receipt generated yet.</pre>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
